# DataGripe's own state: accounts, sessions, workspaces, documents, and
# the encrypted datasource secrets. Not the databases people connect to
# from inside the app — those are wherever they already are.
#
# A single StatefulSet is the simple answer, and a deliberate floor
# rather than a recommendation: a managed PostgreSQL is better operated
# than this, and switching to one means deleting this file and pointing
# APP_DATABASE_URL at it.
apiVersion: v1
kind: Service
metadata:
  name: datagripe-postgres
  namespace: datagripe
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: datagripe
    app.kubernetes.io/component: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: datagripe-postgres
  namespace: datagripe
spec:
  serviceName: datagripe-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: datagripe
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: datagripe
        app.kubernetes.io/component: postgres
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: datagripe
            - name: POSTGRES_DB
              value: datagripe
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: datagripe
                  key: POSTGRES_PASSWORD
            # A subdirectory, because the volume's root is not empty on
            # every storage class and initdb requires an empty directory.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "datagripe", "-d", "datagripe"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "datagripe", "-d", "datagripe"]
            initialDelaySeconds: 30
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
