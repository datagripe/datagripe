# Replace every value below before applying. Generate the two DataGripe
# secrets with:
#
#   openssl rand -base64 32
#
# CONNECTION_ENCRYPTION_KEY encrypts datasource passwords at rest and
# cannot be regenerated: rotating it orphans every stored password. Keep a
# copy somewhere other than beside the database backup.
#
# For anything beyond a first deployment these belong in a secret manager
# — External Secrets, Sealed Secrets, your cloud's CSI driver — rather
# than in a file next to the manifests that reference it.
apiVersion: v1
kind: Secret
metadata:
  name: datagripe
  namespace: datagripe
type: Opaque
stringData:
  # Must match POSTGRES_PASSWORD below — and be URL-safe, because here it
  # is part of a URL. `openssl rand -hex 32` avoids the question; a `/`
  # or a `+` from `openssl rand -base64` ends the password early.
  APP_DATABASE_URL: postgres://datagripe:CHANGE-ME@datagripe-postgres:5432/datagripe
  CONNECTION_ENCRYPTION_KEY: CHANGE-ME-32-BYTES-MINIMUM-0123456789
  SESSION_SECRET: CHANGE-ME-32-BYTES-MINIMUM-0123456789
  POSTGRES_PASSWORD: CHANGE-ME
