apiVersion: v2
name: datagripe
description: A web-based database IDE inspired by DataGrip
type: application
# Both are the DataGripe release. The chart has no lifecycle of its own —
# `helm package` overwrites these from the git tag when it is published,
# and these values are what a checkout installs in the meantime.
version: 0.0.9
appVersion: "0.0.9"
home: https://datagripe.com
sources:
  - https://github.com/datagripe/datagripe
icon: https://datagripe.com/icon.svg
keywords:
  - database
  - sql
  - postgres
  - mysql
  - ide
maintainers:
  - name: DataGripe
    url: https://github.com/datagripe
