{{- if .Values.ingress.enabled }}
{{- /*
   The host here and `webOrigin` must agree exactly: DataGripe compares
   `webOrigin` against the browser's Origin header on every WebSocket
   upgrade, and rejects a mismatch.
*/ -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "datagripe.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "datagripe.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "datagripe.fullname" $ }}
                port:
                  name: http
          {{- end }}
    {{- end }}
{{- end }}
