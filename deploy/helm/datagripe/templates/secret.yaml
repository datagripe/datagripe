{{- $name := printf "%s-secrets" (include "datagripe.fullname" .) -}}
{{- /*
   Generated once, then kept. `datagripe.keptSecret` reads the previous
   release's value back out of the cluster, so an upgrade that does not
   name these does not rotate them. That matters most for
   CONNECTION_ENCRYPTION_KEY: rotating it does not sign people out, it
   orphans every datasource password stored in the database.

   The PostgreSQL password is resolved here and nowhere else, because a
   second `randAlphaNum` elsewhere would be a second password — the
   StatefulSet and the URL below have to agree, so both read this Secret.
*/ -}}
{{- $password := .Values.postgresql.auth.password | default (include "datagripe.keptSecret" (dict "ctx" . "name" $name "key" "POSTGRES_PASSWORD" "default" (randAlphaNum 32))) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "datagripe.labels" . | nindent 4 }}
  annotations:
    # A `helm uninstall` takes this Secret with it, and
    # CONNECTION_ENCRYPTION_KEY with that. Kept so an accidental one is
    # recoverable; set `secrets.connectionEncryptionKey` explicitly, or
    # back this up, if the datasources in the database matter.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{- if not .Values.secrets.existingSecret }}
  CONNECTION_ENCRYPTION_KEY: {{ .Values.secrets.connectionEncryptionKey | default (include "datagripe.keptSecret" (dict "ctx" . "name" $name "key" "CONNECTION_ENCRYPTION_KEY" "default" (randAlphaNum 44))) | quote }}
  SESSION_SECRET: {{ .Values.secrets.sessionSecret | default (include "datagripe.keptSecret" (dict "ctx" . "name" $name "key" "SESSION_SECRET" "default" (randAlphaNum 44))) | quote }}
  {{- end }}
  {{- if .Values.postgresql.enabled }}
  POSTGRES_PASSWORD: {{ $password | quote }}
  {{- end }}
  {{- if and (ne .Values.database.mode "embedded") (not .Values.database.existingSecret) }}
  {{- if .Values.postgresql.enabled }}
  APP_DATABASE_URL: {{ printf "postgres://%s:%s@%s:5432/%s" .Values.postgresql.auth.username $password (include "datagripe.postgresFullname" .) .Values.postgresql.auth.database | quote }}
  {{- else }}
  APP_DATABASE_URL: {{ required "database.url is required when postgresql.enabled is false and database.mode is external" .Values.database.url | quote }}
  {{- end }}
  {{- end }}
