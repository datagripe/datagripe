apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "datagripe.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "datagripe.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: {{ .Values.replicaCount }}
  {{- if or (eq .Values.database.mode "embedded") (eq (int .Values.replicaCount) 1) }}
  # Recreate, not RollingUpdate: the embedded cluster and the data volume
  # take one writer, and with a single replica there is nothing to gain
  # from briefly running two versions against one schema.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "datagripe.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        {{- include "datagripe.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: server
      annotations:
        # Roll the pods when the configuration they were started with
        # changes, rather than when the image tag happens to.
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: datagripe
          image: {{ include "datagripe.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3001
          env:
            {{- include "datagripe.env" . | nindent 12 }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
          # Embedded mode runs initdb before it listens, which is why the
          # startup budget is generous and the liveness probe only starts
          # counting after it.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 60
          # /health reports that the process is serving, deliberately not
          # what it can reach: a database outage should not become a
          # restart loop on top of a database outage.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "datagripe.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
