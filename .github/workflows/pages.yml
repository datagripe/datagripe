name: Site

# Builds `site/` and deploys it to GitHub Pages. No `gh-pages` branch:
# Pages can publish a workflow artifact, so the site's source lives
# beside the code it describes and cannot drift onto a branch nobody
# looks at.
#
# Requires Settings → Pages → Source = "GitHub Actions", once.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/site/**"
      - ".github/workflows/pages.yml"
      # Several pages are rendered from the repository rather than
      # written in site/content, so a change to any of these changes the
      # site without touching site/: the rules page comes from the gripes
      # catalogue, the roadmap page from roadmap.md, the release notes
      # from the changelog, the specs from docs/spec, and the adapters
      # table from the contracts. Leaving these out means shipping a rule
      # the website denies, or a spec it still describes as planned.
      - "roadmap.md"
      - "CHANGELOG.md"
      - "docs/spec/**"
      - "packages/gripes/**"
      - "packages/contracts/src/adapters.ts"
      # The version too: the Helm examples read it from here through
      # `<!--dg:version-->` rather than stating it, so a version bump
      # changes the site. This is also what makes a release redeploy —
      # a release commit always touches package.json and the changelog,
      # so the release workflow does not need to deploy the site itself
      # and deliberately does not. Two runs racing for one Pages
      # deployment means one of them loses, and the one that lost was
      # reported as a failed release.
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A queued deploy should replace a pending one, but never cancel a run
# that is mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      # Renders the site into site/dist, and refuses to publish a
      # broken internal link, an unparseable roadmap line, or a rule
      # listed as planned that has already shipped. See site/README.md.
      - name: Build the site
        run: bun run build:site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

      - id: deploy
        uses: actions/deploy-pages@v4
