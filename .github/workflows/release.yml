name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  # npm publishes with provenance, which is signed with this.
  id-token: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web
        run: bun run --cwd apps/web build

      - name: Package web bundle
        run: |
          mkdir -p "$GITHUB_WORKSPACE/release-assets"
          tar -czf "$GITHUB_WORKSPACE/release-assets/datagripe-web-${GITHUB_REF_NAME}.tar.gz" -C apps/web/dist .

      - uses: actions/upload-artifact@v4
        with:
          name: asset-web
          path: release-assets/*
          if-no-files-found: error

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: macos-latest
            platform: macos-arm64
          - os: windows-latest
            platform: win-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Sync Electrobun devkit
        run: bunx electrobun sync

      # Not `electrobun build` directly: that skips staging the backend
      # (bundled server, migrations, web app, PostgreSQL binaries) and
      # ships an app that cannot start. It also builds the web app, which
      # this job does not do separately.
      - name: Build desktop app
        run: bun run build

      # `artifacts/stable-*` is the update manifest and the bundle it
      # names. Their generated filenames are the ones the installed app
      # asks `release.baseUrl` for, so they are uploaded verbatim —
      # renaming them per tag would break `releases/latest/download`.
      - name: Package desktop build (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p "$GITHUB_WORKSPACE/release-assets"
          tar -czf "$GITHUB_WORKSPACE/release-assets/datagripe-desktop-${GITHUB_REF_NAME}-${{ matrix.platform }}.tar.gz" -C "build/stable-${{ matrix.platform }}" .
          cp artifacts/stable-* "$GITHUB_WORKSPACE/release-assets/"

      - name: Package desktop build (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE/release-assets" | Out-Null
          Compress-Archive -Path "build/stable-${{ matrix.platform }}/*" -DestinationPath "$env:GITHUB_WORKSPACE/release-assets/datagripe-desktop-$env:GITHUB_REF_NAME-${{ matrix.platform }}.zip"
          Copy-Item artifacts/stable-* -Destination "$env:GITHUB_WORKSPACE/release-assets/"

      - uses: actions/upload-artifact@v4
        with:
          name: asset-desktop-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error

  # Multi-arch because `embedded-postgres` ships per-platform binaries and
  # an arm64 node running an amd64 image would emulate PostgreSQL as well
  # as the server. QEMU builds the arm64 image; it is slow and it is once
  # per release.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # `bunx @datagripe/cli`. The published package is `dist/` — the bundled
  # server, its migrations, the built web app and the launcher — so npm
  # publishes a directory rather than the workspace, which is private and
  # would need four unpublishable packages published first.
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      # Node 24 for npm 11, which is what understands the OIDC exchange
      # below. Node here is only the publisher — DataGripe runs on Bun.
      #
      # Deliberately no `registry-url`: that input writes an .npmrc
      # containing `_authToken=${NODE_AUTH_TOKEN}` and exports a
      # placeholder for it, and npm that finds a credential configured
      # uses it rather than exchanging the OIDC token. The placeholder is
      # not a credential, so the publish 404s with no hint that the
      # trusted publishing it was told to do never happened.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Trusted publishing needs 11.5.1 or later and the runner's bundled
      # npm is whatever Node shipped with. Pinned rather than @latest so a
      # release does not depend on what npm published this morning.
      - name: npm new enough for trusted publishing
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build the distribution
        run: bun run build:dist

      # The tag is the release; a package.json version that disagrees with
      # it would publish something nobody asked for under a name they did.
      - name: Tag matches the package version
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          built="$(bun --print "require('./dist/package.json').version")"
          if [ "$tagged" != "$built" ]; then
            echo "tag $GITHUB_REF_NAME does not match dist version $built" >&2
            exit 1
          fi

      # No NPM_TOKEN: npm is a trusted publisher for this repository and
      # this workflow filename, and exchanges the job's OIDC token for a
      # short-lived one. Provenance comes with it and is not a flag.
      #
      # The trust is registered against `release.yml` by name, so renaming
      # this file breaks publishing until it is re-registered — see
      # docs/releasing.md.
      # --loglevel verbose so a trusted-publishing failure says so. By
      # default npm reports a rejected OIDC exchange as ENEEDAUTH, "you
      # need to authorize this machine using npm adduser" — which points
      # at a missing token rather than at the exchange it just tried and
      # was refused. Verbose prints the exchange and the registry's
      # reason on the line above it.
      # `|| already published` so re-running a release that got part way
      # is not blocked by the one step that cannot be repeated. npm is
      # the source of truth for what is published; a second attempt at
      # the same version is a no-op, not a failure.
      - name: Publish
        run: |
          if npm view "@datagripe/cli@$(npm pkg get version | tr -d '"')" version > /dev/null 2>&1; then
            echo "already published, nothing to do"
            exit 0
          fi
          npm publish --access public --loglevel verbose
        working-directory: dist

  # The chart is published as an OCI artifact beside the image it runs,
  # so `helm install oci://…` needs no chart repository, no index.yaml
  # and no GitHub Pages — and the two are always the same release.
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Package and push
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Both versions come from the tag rather than Chart.yaml: the
          # chart has no lifecycle of its own, and one of them silently
          # lagging is how people install last month's manifests against
          # this month's image.
          helm package deploy/helm/datagripe \
            --version "$version" --app-version "$version" \
            --destination "$RUNNER_TEMP/chart"
          helm registry login ghcr.io \
            --username ${{ github.actor }} \
            --password-stdin <<< "${{ secrets.GITHUB_TOKEN }}"
          helm push "$RUNNER_TEMP/chart/datagripe-$version.tgz" \
            "oci://ghcr.io/${{ github.repository_owner }}/charts"

  # No site job. datagripe.com is rebuilt by pages.yml on the push to
  # main, which a release always makes — it bumps package.json and the
  # changelog, both of which the site is rendered from. Calling
  # pages.yml from here as well put two runs into one Pages deployment
  # for the same commit; the second was rejected before it ran a step,
  # and a release that shipped every artifact correctly was reported as
  # failed. See .github/workflows/pages.yml.

  release:
    needs: [web, desktop, image, npm, chart]
    runs-on: ubuntu-latest
    steps:
      # `asset-*` and not everything: docker/build-push-action uploads a
      # `.dockerbuild` build record of its own, and an unfiltered
      # download both fails on it and would attach it to the release.
      - uses: actions/download-artifact@v4
        with:
          pattern: asset-*
          path: release-assets
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
